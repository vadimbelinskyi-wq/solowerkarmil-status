name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://ipinfo.io/country || true
          for ua in "Mozilla/5.0 (compatible; StatusCheck/1.0)" "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"; do
            echo "== $ua"
            curl -s -o /dev/null -D - -A "$ua" https://solowerkarmil.com/ | grep -iE '^(HTTP|location|server|cf-ray)'
          done
